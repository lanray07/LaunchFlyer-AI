name: Update Subscription Promotional Images

on:
  workflow_dispatch:

jobs:
  update-subscription-promotional-images:
    name: Replace subscription promotional images
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      APP_ID: "6777979967"
      ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
      ASC_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Upload subscription promotional images
        run: ruby tools/upload_subscription_promotional_images.rb
